    StandardTransaction:
      type: object
      required:
        - schema_version
        - transaction_date
        - value_date
        - amount_cents
        - description
        - currency
        - raw_row_number
        - import_job_id
        - preset_version_id
        - line_hash
      properties:
        schema_version:
          type: string
          const: '1.0'
        transaction_date:
          type: string
          format: date
        value_date:
          type: string
          format: date
        amount_cents:
          type: integer
          description: Signed integer; inflow positive, outflow negative (ADR 0003 §1).
        description:
          type: string
          maxLength: 500
        counterparty:
          type: string
          maxLength: 200
        balance_cents:
          type: integer
        currency:
          type: string
          const: JPY
        raw_row_number:
          type: integer
        import_job_id:
          type: string
        preset_version_id:
          type: string
        line_hash:
          type: string
          description: 'sha256:… of transaction_date + amount_cents + description.'

