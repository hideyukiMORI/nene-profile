name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  # 週次 schedule。依存監査（npm run audit、下記 "Audit" ステップ）を定期的に
  # 再走らせ、マージ後に新規公開された advisory を拾うためのもの。
  # この艦(nene-profile)には月曜 01:05 UTC = 10:05 JST を割り当て済み
  # （フリート内の同時発火回避のため艦ごとに分をずらしている。
  #   使用済み: 00=origin/fleet-tooling, 05=clear, 10=deal, 15=field, 20=payout,
  #   25=records, 30=nene2-python, 35=vault, 40=records-commercial, 45=concierge,
  #   50=contact, 55=invoice, 05(1時台)=nene-profile）。
  #
  # 🔴 既知の限界: public リポジトリの scheduled workflow は、60日間 push 等の
  # activity が無いと GitHub 側で自動的に無効化される
  # （https://docs.github.com/actions/using-workflows/events-that-trigger-workflows#schedule）。
  # このリポジトリが 60日以上休眠すると、休眠に気づくために必要なこの装置自体が
  # 止まる。リポジトリの外から run の日時を監視する仕組みが別途必要
  # （詳細: _work/handoff-nene2-python-2026-08-12-schedule-rollout-note.md）。
  schedule:
    - cron: '5 1 * * 1'

  # 手動トリガー。simulate_failure=true で frontend-check を意図的に失敗させ、
  # notify-failure（下記）が正しく発火するかをその場で検証できる。
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: '意図的に frontend-check を失敗させ、失敗通知の経路を検証する'
        type: boolean
        default: false

# event_name を含めるのは、schedule / workflow_dispatch の実行が push の実行に
# cancel-in-progress で巻き込まれて消えるのを防ぐため（同じ ref でも event が違えば
# 別グループになる。nene-origin で実測された罠）。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Checkout の直後に置く（先頭ではない）。このジョブは
      # `defaults.run.working-directory: frontend` を持つため、Checkout 前だと
      # そのディレクトリがまだ存在せず `cd` が `exit 1` より先に失敗して、
      # ログの原因表示が嘘になる（第1波 nene-deal #207 で実測・是正済み）。
      - name: Simulate failure (validation only)
        if: inputs.simulate_failure
        run: exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      # audit-ci = npm audit ＋ advisory 単位の allowlist（理由・期限つき例外）。
      # allowlist に無い high/critical は fail。config = frontend/audit-ci.jsonc
      - name: Audit (fail on high/critical)
        run: npm run audit

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E
        run: npm run e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # 週次 schedule の失敗は、push/PR の失敗と違って「起こした本人がその場で見る」ことが
  # ない。誰にも気づかれないまま埋もれるのを防ぐため、schedule 実行の失敗（と
  # 検証用の simulate_failure）に限定して Issue を起票する。
  # 実装元: nene2-python PR #773-775 / 申し送り: _work/handoff-nene2-python-2026-08-12-schedule-rollout-note.md
  notify-failure:
    name: Open an issue when the scheduled run fails
    if: failure() && (github.event_name == 'schedule' || inputs.simulate_failure)
    needs: [frontend-check, e2e]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      ISSUE_TITLE: '🔴 nene-profile: 週次 CI（schedule）が失敗しています'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }} # 必須: checkout していないジョブでは gh がリポジトリを特定できない
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Create or update the failure issue
        run: |
          set -euo pipefail
          existing="$(gh issue list --state open --limit 100 --json number,title \
            | jq -r --arg t "$ISSUE_TITLE" 'map(select(.title == $t)) | .[0].number // empty')"
          body="週次の schedule 実行が失敗しました。 実行: ${RUN_URL}"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$ISSUE_TITLE" --body "$body"
          fi
